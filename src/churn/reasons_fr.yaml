# Display texts for the sales reps (French, deliverable). Keys = English feature names.
# Placeholders in braces are filled from the client's own values.
# freq_trend and rev_trend are log-ratios: the "baisse de {value} %" value is 100 * (1 - exp(trend)).
recency_days: "Aucun achat depuis {value} jours"
recency_ratio: "Silence de {value} fois son rythme habituel"
freq_trend: "Fréquence d'achat en baisse de {value} % sur 90 jours"
rev_trend: "Chiffre d'affaires en baisse de {value} % sur 90 jours"
freq_90d: "Seulement {value} jours d'achat sur les 90 derniers jours"
freq_180d: "{value} jours d'achat sur 180 jours"
rev_90d: "Chiffre d'affaires de {value} sur 90 jours"
rev_180d: "Chiffre d'affaires de {value} sur 180 jours"
gap_median: "Écart habituel entre deux achats : {value} jours"
gap_p90: "Écart long entre deux achats : {value} jours"
# The two "previous 90 days" variables have no direction of their own: the sentence states the two values, without a verdict.
freq_prev_90d: "{value} jours d'achat entre 180 et 90 jours avant, {freq_90d} depuis"
rev_prev_90d: "Chiffre d'affaires de {value} entre 180 et 90 jours avant, {rev_90d} depuis"
