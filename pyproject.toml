[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "ClientCo churn prevention: reproducible, comparable experiment runs."
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1",
    "duckdb>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.9",
    "xgboost>=3.4",
    "optuna>=5.0",
    "shap>=0.54",
    "PyYAML>=6.0",
    "pyarrow>=26.0",
    "matplotlib>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ipykernel>=7.4"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn = ["reasons_fr.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
