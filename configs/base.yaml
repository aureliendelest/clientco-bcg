# Base configuration: every option with its default. Experiments only override what changes
# (`extends: configs/base.yaml`). Values marked "team hypothesis" are placeholders to confirm.
name: base
seed: 0

dataset:
  raw_csv: data/dataset_sales_2026.csv
  shifted_parquet: data/sales_shifted.parquet   # written once by `churn ingest`
  shift_years: 2                                # fictitious dates

snapshots:
  lookback_days: 180        # features use history strictly before the snapshot date
  step: monthly             # monthly | weekly (weekly gave the same quality at ~4x the rows)
  train_start: "2025-03-22" # shifted dates (the first 6 months of data only feed the features)
  train_end: null           # derived: last monthly date whose label is known before the test (22/09/2025 for A, 22/12/2025 for B)
  test_date: "2026-03-22"   # never touched during development
  feature_set: basic

label:
  kind: fixed_horizon       # fixed_horizon (label A) | relative_horizon (label B) | partial_drop (second score)
  horizon_days: 180         # label A: lost = no purchase in the next 180 days (also the evaluation truth)
  k: 3.0                    # label B: H_i = clip(k * p90_gap_i, h_min, h_max)
  h_min: 45
  h_max: 90
  drop_threshold: 0.5       # partial_drop: revenue after T < 50 % of revenue before T
  truth_days: 180           # evaluation truth, whatever the training label
  min_purchases: 6          # perimeter: regular clients (>= 6 purchase days over 180 days, median gap <= 30 days)
  max_median_gap_days: 30
  rhythm_bounds_days: {fast_max: 7}

model:
  type: hgb                 # baseline | logreg | hgb | xgb
  params: {}
  calibration: isotonic     # isotonic | none
  calibration_by_segment: true
  segmentation: single      # single | per_segment (key accounts: per_segment by value)
  segment_by: frequency     # frequency | value
  tuning: false             # Optuna, once the best model family is chosen
  tuning_trials: 50
  cv_folds: 5               # grouped by client

scoring:
  value_definition: ca_180d_annualized   # ca_180d_annualized | ca_12m
  min_proba: 0.0                         # minimal calibrated probability to be listed
  calls_per_week: 500                    # team hypothesis (100 reps x 5 calls), company-wide
  dataset_share: 0.30                    # the dataset is ~30 % of revenue
  list_size_k: 700                       # monthly list at dataset scale (600 to 760 calls a month)
  total_share_of_list: 0.25              # places reserved to the total-churn score; the rest goes to the partial score
  opportunity_cost_per_action: null

evaluation:
  k_values: [700, 2000, 4000]            # monthly list, previous tables, six cumulated lists
  metrics: [capture_at_k, size_only_capture, oracle_capture, pr_auc, brier_raw, brier_cal]   # see evaluation.py
  bootstrap_n: 200

impact:
  retention_scenarios: [0.1, 0.2, 0.3]   # team hypothesis, measured by the pilot
  lost_revenue_share: [0.034, 0.048]     # measured on the dataset (3.4 to 4.8 % of revenue per year)
  gross_margin: 0.2465
  annual_revenue_meur: 15504.212
