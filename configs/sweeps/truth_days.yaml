# Sensitivity of the rolling backtest to the evaluation truth (docs/03_evidence.md, lemma 2: 180 days is a
# convention). Same grid as backtest.yaml, with the truth "no purchase within `truth_days`" at 120 and 240 days;
# the 180-day runs are the ones of backtest.yaml. The training labels do not change (A = 180 days, B = relative).
# At 240 days the truth is unknown for the last date (2026-02-22 + 240 days is after the end of the data): those
# runs have no metric.
base: configs/experiments/hgb.yaml
grid:
  label.truth_days: [120, 240]
  model.type: [baseline, logreg, hgb, xgb]
  label.kind: [fixed_horizon, relative_horizon]
  snapshots.test_date: [2025-09-22, 2025-10-22, 2025-11-22, 2025-12-22, 2026-01-22, 2026-02-22]
